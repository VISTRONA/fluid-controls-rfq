<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | RFQ Traceability Management System</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    body {
      background: radial-gradient(circle at 10% 20%, #0f172a 0%, #1e293b 90%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-container {
      width: 100%;
      max-width: 480px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .demo-credentials-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 24px;
    }
    .quick-login-btn {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .quick-login-btn:hover {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="text-center mb-4">
        <div class="brand-icon-box mx-auto mb-3" style="width: 52px; height: 52px; font-size: 24px;">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <h2 class="fw-bold text-dark mb-1" style="font-size: 24px;">RFQ Traceability System</h2>
        <p class="text-muted small">Sign in to manage and trace RFQ lifecycles</p>
      </div>

      <!-- Flash alerts -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show rounded-3 py-2 small" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.login') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label-styled" for="email">Work Email or Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-regular fa-envelope"></i></span>
            <input type="text" class="form-control form-control-styled border-start-0 ps-0" id="email" name="email" required placeholder="admin@example.com" value="admin@example.com">
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label-styled mb-0" for="password">Password</label>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control form-control-styled border-start-0 ps-0" id="password" name="password" required placeholder="••••••••" value="Password123!">
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" name="remember" checked>
            <label class="form-check-label text-muted small" for="remember">
              Remember me
            </label>
          </div>
          <span class="badge bg-primary-subtle text-primary border border-primary-subtle">Demo Environment</span>
        </div>

        <button type="submit" class="btn btn-enterprise-primary w-100 justify-content-center py-2 fs-6">
          <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In to System
        </button>
      </form>

      <!-- Quick Role Fill for fast testing -->
      <div class="demo-credentials-box">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <span class="fw-bold text-dark" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">
            <i class="fa-solid fa-key text-warning me-1"></i> Quick Test Logins
          </span>
          <span class="text-muted" style="font-size: 10.5px;">Click to auto-fill</span>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <button type="button" class="quick-login-btn" onclick="fillCreds('admin@example.com', 'Password123!')">
            <i class="fa-solid fa-shield text-danger me-1"></i> Admin
          </button>
          <button type="button" class="quick-login-btn" onclick="fillCreds('manager@example.com', 'Password123!')">
            <i class="fa-solid fa-user-tie text-primary me-1"></i> Manager
          </button>
          <button type="button" class="quick-login-btn" onclick="fillCreds('user@example.com', 'Password123!')">
            <i class="fa-solid fa-user text-success me-1"></i> Sales User
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function fillCreds(email, pwd) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pwd;
    }
  </script>
</body>
</html>
