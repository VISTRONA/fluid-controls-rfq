services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/instance/rfq_tracker.db
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - rfq_data:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/login')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  notifications:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/instance/rfq_tracker.db
    command: ["flask", "--app", "app", "notifications-run", "--loop"]
    volumes:
      - rfq_data:/app/instance
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  rfq_data:
